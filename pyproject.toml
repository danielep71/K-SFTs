# Quality settings for the repository's Python tooling (tools/). check.py and
# its gates need only the standard library, except check_workflows.py, which
# needs PyYAML; build_template.py needs xlsxwriter and lo_regression.py
# openpyxl. Ruff, mypy and PyYAML are CI and development tools, installed from
# tools/requirements-quality-ci.txt.

[tool.ruff]
target-version = "py312"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
# Every module, tests included, is held to the full strict bundle.
strict = true
