name: Repository integrity
run-name: Repository integrity — ${{ github.ref_name }} @ ${{ github.sha }}

# Runs tools/check.py, the single entry point for the repository's checks,
# on every pull request and push to the integration branches. No path filter:
# the job reports on every pull request, so it can be a required check.
# Static tooling, label and workflow checks only; no VBA compilation or Excel.

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Ruff and mypy are hash-locked in tools/requirements-quality-ci.txt;
      # actionlint is verified against the checksum below.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify candidate identity
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install hash-locked Python quality tools
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r tools/requirements-quality-ci.txt

      - name: Install checksum-verified actionlint
        run: |
          validator_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${validator_dir}/actionlint.tar.gz"
          mkdir -p "$validator_dir"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$validator_dir" actionlint
          echo "$validator_dir" >> "$GITHUB_PATH"

      - name: Run all checks
        run: python tools/check.py --ci

      - name: Publish check summary
        if: always()
        run: |
          if [[ -f test-results/repository-integrity.md ]]; then
            cat test-results/repository-integrity.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced; inspect the failed setup or execution step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-integrity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
