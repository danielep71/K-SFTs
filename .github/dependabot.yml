# Proposes updates to the SHA-pinned GitHub Actions used by the workflows.
# Every update arrives as a pull request for maintainer review; nothing merges
# automatically. See tools/README.md, "Dependency updates".
# target-branch must name the active release branch in docs/GOVERNANCE.md.
# Milestones belong to issues only; link each PR to a tracking issue in triage.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.1.0
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
