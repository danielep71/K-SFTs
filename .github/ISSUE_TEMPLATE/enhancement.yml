name: "✨ Enhancement"
description: "Propose new behavior, a calculation change or a tooling improvement."
title: "[Enhancement]: "
labels: ["enhancement", "P3"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Enhancement

        **Outcome first · Cited rule · Checkable acceptance · Explicit boundaries**

        Describe the result you need and how it will be proved before any implementation. A calculation change cites its regulatory source and states units and valid input domains. Triage sets the milestone and confirms the priority (`P3` by default; `P1` only for a confirmed calculation bug, reported as a bug).

        > [!NOTE]
        > Synthetic data only: no real trades, counterparties, collateral, credentials or private links.

  - type: dropdown
    id: area
    attributes:
      label: "🎚️ Area"
      options:
        - Calculation engine
        - Public API
        - Workbook and VBA source
        - Tests and fixtures
        - Tooling and CI
        - Documentation
        - Repository and governance
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem and user"
      description: What need is unmet, and for whom.
    validations:
      required: true

  - type: textarea
    id: requested
    attributes:
      label: "🧩 Requested behavior"
      description: The observable result. For a calculation change, cite the source and locator and state units and valid input domains.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "📐 Scope and non-goals"
      description: What is in and out of this change.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🏁 Acceptance criteria"
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "🧪 Validation evidence required"
      description: The checks, scenarios and, for a calculation, the source of the expected values and their tolerance.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: "💥 Compatibility impact"
      description: Effect on the public API, computed results, input or output layouts and supported hosts. Write "None" if there is none.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "🔗 Dependencies and blocking status"
      description: Name each prerequisite as an issue link (#12) or on a line starting "External condition:". Write "None" if nothing blocks this work. Triage adds `blocked` only while a named prerequisite is unresolved.
      placeholder: None
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "☑️ Submission checks"
      options:
        - label: I searched open and closed issues for an equivalent proposal.
          required: true
        - label: I separated the required behavior from implementation preferences.
          required: true
        - label: This proposal contains only synthetic data and no secrets or private links.
          required: true
